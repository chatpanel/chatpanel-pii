# Publish @chatpanel/pii to npm via OIDC Trusted Publishing — NO token.
# Identical mechanism to @chatpanel/bridge (which publishes this way successfully).
#
# One-time setup on npmjs.com (mirror the working @chatpanel/bridge entry):
#   package @chatpanel/pii → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : chatpanel
#     Repository           : chatpanel-pii
#     Workflow filename    : publish.yml      (just the filename, not the path)
#     Environment          : (leave blank)
# Version-guarded: an unchanged version just skips.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    # WHICH RUNNER: GitHub's by default; the repo variable RELEASE_RUNNER (e.g. `self-hosted`)
    # moves it to a machine of ours. Set it when GitHub-hosted jobs cannot start — since
    # 2026-09-21 every hosted job on this org is refused at once ("recent account payments have
    # failed or your spending limit needs to be increased"), while a self-hosted job on the same
    # org runs normally (proved: chatpanel-extension run 35697225331, runner mac-local).
    #
    # This is the route that PUBLISHES, not tools/publish-npm.mjs, because the ordering is right
    # by construction: the workflow runs from the commit that was pushed, so npm can never carry
    # a build whose source is only on somebody's laptop. It also needs no npm token and no 2FA
    # prompt — publishing here is OIDC trusted publishing.
    #
    # NEVER point this at a self-hosted runner from a PUBLIC repo with a pull_request trigger:
    # a fork's PR would run its own code on that machine.
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish if the version is new
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already on npm — bump the version to publish."
          else
            npm publish --provenance --access public
            echo "Published $NAME@$VER"
          fi
