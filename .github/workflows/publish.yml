# Publish @chatpanel/pii to npm via OIDC Trusted Publishing — NO token.
# Identical mechanism to @chatpanel/bridge (which publishes this way successfully).
#
# One-time setup on npmjs.com (mirror the working @chatpanel/bridge entry):
#   package @chatpanel/pii → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : chatpanel
#     Repository           : chatpanel-pii
#     Workflow filename    : publish.yml      (just the filename, not the path)
#     Environment          : (leave blank)
# Version-guarded: an unchanged version just skips.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    # WHICH RUNNER: GitHub's by default; the repo variable RELEASE_RUNNER (e.g. `self-hosted`)
    # moves it to a machine of ours. Set it when GitHub-hosted jobs cannot start — since
    # 2026-09-21 every hosted job on this org is refused at once ("recent account payments have
    # failed or your spending limit needs to be increased"), while a self-hosted job on the same
    # org runs normally (proved: chatpanel-extension run 35697225331, runner mac-local).
    #
    # This is the route that PUBLISHES, not tools/publish-npm.mjs, because the ordering is right
    # by construction: the workflow runs from the commit that was pushed, so npm can never carry
    # a build whose source is only on somebody's laptop.
    #
    # ON A GITHUB-HOSTED RUNNER it needs no token and no 2FA prompt — OIDC trusted publishing.
    # ON OURS it cannot: npm does not support trusted publishing from self-hosted runners, so
    # the publish step falls back to an NPM_TOKEN secret. See that step.
    #
    # NEVER point this at a self-hosted runner from a PUBLIC repo with a pull_request trigger:
    # a fork's PR would run its own code on that machine.
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish if the version is new
        env:
          RELEASE_RUNNER: ${{ vars.RELEASE_RUNNER }}
          # actions/setup-node wrote an npmrc (under RUNNER_TEMP, not the machine's own) whose
          # token IS this variable, so handing it over needs no file to be written — which
          # matters on a self-hosted runner, where `npm config set` would edit the owner's real
          # ~/.npmrc. Absent, it is empty, exactly as before.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # HOW THIS JOB AUTHENTICATES depends on where it runs, and it has to:
          # npm's OIDC trusted publishing does NOT support self-hosted runners ("self-hosted
          # runners are not currently supported", docs.npmjs.com/trusted-publishers). So on a
          # GitHub-hosted runner this publishes with no token at all, and on ours it needs the
          # NPM_TOKEN secret. When hosted runners are available again, clear RELEASE_RUNNER and
          # this goes back to being tokenless.
          #
          # A token cannot publish a package whose npm 2FA setting is `mfa=publish` — that
          # rejects every token, whatever its rights — so a package published this way must be
          # on `mfa=automation`. That is a per-package setting, changed on npmjs.com.
          if [ -n "$RELEASE_RUNNER" ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo "::error title=No NPM_TOKEN::RELEASE_RUNNER is set, so this job is on a self-hosted runner, where npm trusted publishing does not work. Add an NPM_TOKEN repo secret (this org is on GitHub Free, where ORG secrets reach public repos only — it must be a REPO secret), or clear RELEASE_RUNNER to publish from a GitHub-hosted runner by OIDC."
              exit 1
            fi
            echo "self-hosted runner: authenticating with the NPM_TOKEN secret (trusted publishing is hosted-only)"
          else
            echo "GitHub-hosted runner: publishing by OIDC trusted publishing, no token"
          fi
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER already on npm — bump the version to publish."
          else
            npm publish --provenance --access public
            echo "Published $NAME@$VER"
          fi
